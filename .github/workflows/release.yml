name: Build and release Fabric mod
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.0.0-mc1.21.11
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installable mod and compile client tests
        run: ./gradlew build compileGametestJava --no-daemon
      - name: Package project and checksums
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=FastItems-1.21.11/ --output=build/libs/FastItems-1.21.11-project.zip HEAD
          cd build/libs
          sha256sum fastitems-port-*.jar FastItems-1.21.11-project.zip > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" build/libs/fastitems-port-*.jar build/libs/FastItems-1.21.11-project.zip build/libs/SHA256SUMS.txt \
            --verify-tag --title "Fast Items 1.21.11 Port — 1.0.0 (Fabric)" \
            --notes 'Clientseitiger Fabric-Port für Minecraft 1.21.11. Fabric Loader 0.20.0+ und Fabric API für 1.21.11 erforderlich. Nur die normale JAR in den mods-Ordner legen. Alle vier Optionen und Item-ID-Filter in config/fastitems.json. Build und Client-GameTest wurden in der Entwicklungsumgebung erfolgreich ausgeführt; CI baut die JAR erneut. Vollständiger Quellcode, Bauanleitung und Testbericht mit Screenshots im Projekt-ZIP. Keine FPS-Garantie; Iris/Sodium/Shader nicht separat getestet. Keine NeoForge-Variante. Basierend auf Noryea/fast-items (CC0-1.0), kein offizieller Noryea-Release.'
